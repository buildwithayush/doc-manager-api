name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doc_manager_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
         DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doc_manager_test_db
         TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doc_manager_test_db
         SECRET_KEY: test_secret_key
         ALGORITHM: HS256
         ACCESS_TOKEN_EXPIRE_MINUTES: 60
        run: pytest